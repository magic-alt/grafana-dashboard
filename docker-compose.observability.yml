x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.7}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [backend]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  pyroscope:
    image: grafana/pyroscope:${PYROSCOPE_VERSION:-2.2.0}
    restart: unless-stopped
    ports:
      - "${PYROSCOPE_PORT:-4040}:4040"
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    networks: [backend]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.7}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [backend]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v${PROMETHEUS_VERSION:-3.14.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  alloy-profiler:
    profiles: ["lean-ebpf"]
    image: grafana/alloy:${ALLOY_VERSION:-1.18.0}
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    privileged: true
    pid: host
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./observability/alloy-ebpf.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      pyroscope:
        condition: service_started
    networks: [backend]
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.160.0}
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yml"]
    environment:
      OBS_SERVICE_NAMESPACE: ${OBS_SERVICE_NAMESPACE:-magic-alt}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./observability/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks: [backend, frontend]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  collector:
    environment:
      OBSERVABILITY_ENABLED: "true"
      OTEL_SERVICE_NAME: stock-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: stock.collector
    depends_on:
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started

  grafana:
    depends_on:
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_started

  observability-case:
    profiles: ["observability-case"]
    build:
      context: ./collector
    restart: "no"
    command: ["python", "observability_case.py", "--mode", "live"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-stockdash}
      DB_USER: ${POSTGRES_USER:-stock}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TICKERS: ${TICKERS:-AAPL,MSFT,NVDA,TSLA,SPY,QQQ}
      YAHOO_PERIOD: ${YAHOO_PERIOD:-1y}
      YAHOO_INTERVAL: ${YAHOO_INTERVAL:-1d}
      OBSERVABILITY_ENABLED: "true"
      OTEL_SERVICE_NAME: stock-observability-case
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: stock.observability.case
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      OBS_SERVICE_NAMESPACE: ${OBS_SERVICE_NAMESPACE:-magic-alt}
      OBS_PROJECT: stock-lab
      GRAFANA_URL: http://grafana:3000
      PUBLIC_GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3000}
      PUBLIC_TEMPO_URL: http://localhost:${TEMPO_PORT:-3200}
      PUBLIC_PYROSCOPE_URL: http://localhost:${PYROSCOPE_PORT:-4040}
      OBS_ANALYSIS_LOAD_FACTOR: ${OBS_ANALYSIS_LOAD_FACTOR:-12}
    volumes:
      - ./test-results:/app/test-results
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_started
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started
    networks: [backend]
    logging: *default-logging

  observability-control:
    profiles: ["lab-control"]
    build:
      context: ./collector
    restart: unless-stopped
    command: ["python", "observability_control.py"]
    ports:
      - "${OBS_CONTROL_PORT:-18080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-stockdash}
      DB_USER: ${POSTGRES_USER:-stock}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TICKERS: ${TICKERS:-AAPL,MSFT,NVDA,TSLA,SPY,QQQ}
      YAHOO_PERIOD: ${YAHOO_PERIOD:-1y}
      YAHOO_INTERVAL: ${YAHOO_INTERVAL:-1d}
      OBSERVABILITY_ENABLED: "true"
      OTEL_SERVICE_NAME: stock-observability-control
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: stock.observability.control
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      OBS_SERVICE_NAMESPACE: ${OBS_SERVICE_NAMESPACE:-magic-alt}
      OBS_PROJECT: stock-lab
      GRAFANA_URL: http://grafana:3000
      PUBLIC_GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3000}
      PUBLIC_PYROSCOPE_URL: http://localhost:${PYROSCOPE_PORT:-4040}
      OBS_ANALYSIS_LOAD_FACTOR: ${OBS_ANALYSIS_LOAD_FACTOR:-12}
    volumes:
      - ./test-results:/app/test-results
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_started
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started
    networks: [backend, frontend]
    logging: *default-logging

  lean-observability-control:
    profiles: ["lean-lab"]
    build:
      context: ./collector
      dockerfile: Dockerfile.lean
    restart: unless-stopped
    command: ["python", "lean_observability_control.py"]
    ports:
      - "${LEAN_OBS_CONTROL_PORT:-18081}:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-stockdash}
      DB_USER: ${POSTGRES_USER:-stock}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OBSERVABILITY_ENABLED: "true"
      OTEL_SERVICE_NAME: lean-backtest-control
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: lean.backtest.runner
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      OBS_SERVICE_NAMESPACE: ${OBS_SERVICE_NAMESPACE:-magic-alt}
      OBS_PROJECT: lean-local-platform
      GRAFANA_URL: http://grafana:3000
      PUBLIC_GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3000}
      PUBLIC_PYROSCOPE_URL: http://localhost:${PYROSCOPE_PORT:-4040}
      LEAN_PLATFORM_ROOT: /lean/platform
      LEAN_DATA_DIR: /lean/data
      LEAN_RUNS_DIR: /lean/platform/runs
      LEAN_DOCKER_IMAGE: ${LEAN_DOCKER_IMAGE:-quantconnect/lean:18057}
      LEAN_OBS_PROFILE_LOAD_FACTOR: ${LEAN_OBS_PROFILE_LOAD_FACTOR:-8}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LEAN_PLATFORM_ROOT:-./.local/lean-platform}:/lean/platform
      - ${LEAN_DATA_DIR:-./.local/lean-data}:/lean/data
      - ./test-results:/app/test-results
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_started
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started
    networks: [backend, frontend]
    logging: *default-logging

volumes:
  tempo-data:
  pyroscope-data:
  loki-data:
  prometheus-data:
