services:
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.8.1}
    container_name: stockdash-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

  pyroscope:
    image: grafana/pyroscope:${PYROSCOPE_VERSION:-1.14.0}
    container_name: stockdash-pyroscope
    restart: unless-stopped
    ports:
      - "${PYROSCOPE_PORT:-4040}:4040"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.130.1}
    container_name: stockdash-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      - tempo

  collector:
    environment:
      OBSERVABILITY_ENABLED: "true"
      OTEL_SERVICE_NAME: stock-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: stock.collector
    depends_on:
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started

  grafana:
    depends_on:
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started

  observability-case:
    profiles: ["observability-case"]
    build:
      context: ./collector
    container_name: stockdash-observability-case
    restart: "no"
    command: ["python", "observability_case.py", "--mode", "live"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: stockdash
      DB_USER: stock
      DB_PASSWORD: stock
      TICKERS: ${TICKERS:-AAPL,MSFT,NVDA,TSLA,SPY,QQQ}
      YAHOO_PERIOD: ${YAHOO_PERIOD:-1y}
      YAHOO_INTERVAL: ${YAHOO_INTERVAL:-1d}
      OBSERVABILITY_ENABLED: "true"
      OTEL_SERVICE_NAME: stock-observability-case
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: stock.observability.case
      GRAFANA_URL: http://grafana:3000
      PUBLIC_GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3000}
      PUBLIC_TEMPO_URL: http://localhost:${TEMPO_PORT:-3200}
      PUBLIC_PYROSCOPE_URL: http://localhost:${PYROSCOPE_PORT:-4040}
      OBS_ANALYSIS_LOAD_FACTOR: ${OBS_ANALYSIS_LOAD_FACTOR:-12}
    volumes:
      - ./test-results:/app/test-results
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_started
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started

volumes:
  tempo-data:
