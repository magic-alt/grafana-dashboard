name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository_owner }}/grafana-dashboard-collector
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./collector
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grafana-dashboard-collector:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/grafana-dashboard-collector:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/grafana-dashboard-collector@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/grafana-dashboard-collector@${{ steps.build.outputs.digest }}
          artifact-name: collector-${{ github.ref_name }}.spdx.json
          format: spdx-json
      - uses: sigstore/cosign-installer@v3
      - name: Sign immutable image digest
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/grafana-dashboard-collector@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/grafana-dashboard-collector
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
