name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: ci-postgres-password
  GRAFANA_ADMIN_PASSWORD: ci-grafana-password
  GRAFANA_ANONYMOUS_ENABLED: "true"
  LEAN_PLATFORM_ROOT: ./.local/lean-platform
  LEAN_DATA_DIR: ./.local/lean-data

jobs:
  quality:
    name: Python / contracts / Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r collector/requirements.txt
          python -m pip install -e '.[dev]'

      - name: Unit and contract tests
        run: pytest

      - name: Repository architecture contract
        run: python scripts/validate_repo.py

      - name: Lint productized code
        run: ruff check collector/obs_platform collector/observability_support.py tests scripts/validate_repo.py

      - name: Validate Compose rendering
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config >/dev/null

      - name: Validate JavaScript probes parse
        run: |
          for script in scripts/*.mjs; do node --check "$script"; done

  integration:
    name: Deterministic Grafana integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run core stack smoke test
        run: bash scripts/ci_integration.sh

      - name: Dump Docker state on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true

  azure-iac:
    name: Azure Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify Azure CLI
        run: az version

      - name: Build Bicep
        run: az bicep build --file deploy/azure/main.bicep --stdout >/dev/null
