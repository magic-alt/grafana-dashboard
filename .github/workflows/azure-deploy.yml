name: Azure Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, prod]
        required: true
      image_digest:
        description: Immutable collector image digest (sha256:...)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/main.bicep \
            --parameters namePrefix="${{ vars.AZURE_NAME_PREFIX }}" environment="${{ inputs.environment }}"
      - name: Deploy
        run: |
          az deployment group create \
            --name "observability-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/main.bicep \
            --parameters namePrefix="${{ vars.AZURE_NAME_PREFIX }}" environment="${{ inputs.environment }}"
      - name: Azure smoke and cost snapshot
        run: bash scripts/azure_smoke.sh "${{ vars.AZURE_RESOURCE_GROUP }}" "observability-${{ github.run_id }}"
