[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-alt-observability-platform"
version = "2.0.0"
description = "Reusable Grafana/OpenTelemetry observability platform with stock and LEAN reference workloads"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "magic-alt" }]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "PyYAML>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "collector"}

[tool.setuptools.packages.find]
where = ["collector"]
include = ["obs_platform*"]

[tool.pytest.ini_options]
pythonpath = ["collector"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
