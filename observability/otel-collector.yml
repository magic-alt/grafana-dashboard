extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 384
    spike_limit_mib: 96
  resource/defaults:
    attributes:
      - key: service.namespace
        value: ${env:OBS_SERVICE_NAMESPACE:-magic-alt}
        action: insert
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT:-local}
        action: insert
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-ci
        type: string_attribute
        string_attribute:
          key: deployment.environment
          values: [ci]
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 20
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: observability_platform

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, batch]
      exporters: [otlphttp/loki]
